description:
  en: A theme-independent floating 1984 Macintosh companion for DeepSeek Harness with live session status, Mini DSH sidecar agent, flip Note Pad, Floppy Disk Markdown/PNG export, Alarm Clock, MacPaint Lite, and Minesweeper.
  zh: Hello '84（你好 84）：在 DeepSeek Harness 角落养一台活着的 1984 Macintosh，不绑定任何主题，支持宿主状态联动、双模 Mini DSH 副脑、翻页便签、软盘 Markdown/长图导出、复古闹钟、MacPaint 与扫雷。
